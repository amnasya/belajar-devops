name: CD

# Jalan hanya setelah workflow CI sukses pada push ke main.
# Runner self-hosted (laptop) dipakai karena cluster kind tidak bisa dijangkau dari internet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      KUBE_CONTEXT: kind-task-tracker
      NAMESPACE: task-tracker
    steps:
      - name: Set image ke commit yang lulus CI
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/task-tracker:${{ github.event.workflow_run.head_sha }}"
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" set image deployment/app app="$IMAGE"
      - name: Tunggu rollout
        run: kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout status deployment/app --timeout=120s
      - name: Rollback otomatis bila gagal
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout undo deployment/app
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" rollout status deployment/app --timeout=120s
