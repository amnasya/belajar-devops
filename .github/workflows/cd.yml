name: CD

# Jalan hanya setelah workflow CI sukses pada push ke main.
# Runner self-hosted (laptop Windows) dipakai karena cluster kind tidak bisa dijangkau dari internet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: self-hosted
    defaults:
      run:
        # PowerShell, bukan bash: di Windows `bash` bisa mengarah ke WSL yang tidak punya kubectl/kubeconfig Windows.
        shell: powershell
    env:
      KUBE_CONTEXT: kind-task-tracker
      NAMESPACE: task-tracker
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Set image ke commit yang lulus CI
        run: |
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLower()
          $image = "ghcr.io/$owner/task-tracker:$env:SHA"
          Write-Host "Deploy $image"
          kubectl --context $env:KUBE_CONTEXT -n $env:NAMESPACE set image deployment/app "app=$image"
      - name: Tunggu rollout
        run: kubectl --context $env:KUBE_CONTEXT -n $env:NAMESPACE rollout status deployment/app --timeout=120s
      - name: Rollback otomatis bila gagal
        if: failure()
        run: |
          kubectl --context $env:KUBE_CONTEXT -n $env:NAMESPACE rollout undo deployment/app
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl --context $env:KUBE_CONTEXT -n $env:NAMESPACE rollout status deployment/app --timeout=120s
