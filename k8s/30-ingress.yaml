apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: task-tracker
spec:
  ingressClassName: nginx
  rules:
    - host: tasks.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
