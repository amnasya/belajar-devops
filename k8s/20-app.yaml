apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: task-tracker
data:
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: task-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: task-tracker:local   # diganti ke ghcr.io/<owner>/task-tracker:<sha> oleh CD (tahap 06)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: db-secret }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: task-tracker
  labels:
    app: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: http
