apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task-tracker-alerts
  namespace: monitoring
spec:
  groups:
    - name: task-tracker
      rules:
        - alert: AppDown
          expr: (sum(up{namespace="task-tracker", service="app"} == 1) or vector(0)) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Tidak ada pod task-tracker yang sehat selama 1 menit"
